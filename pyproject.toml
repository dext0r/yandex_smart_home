[project]
name = "yandex_smart_home"
version = "1.0.2dev"
requires-python = "~=3.13.2"

[dependency-groups]
test = [
    "pytest-homeassistant-custom-component==0.13.262",
    "mypy-dev==1.16.0a9",
]
homeassistant = [
    "homeassistant==2025.7.2",
    "colorlog>=6.9.0",
]
homeassistant-components = [
    "ha-ffmpeg>=3.2.2",
    "hassil>=3.0.1",
    "home-assistant-intents>=2025.6.23",
    "mutagen>=1.47.0",
    "pymicro-vad>=1.0.2",
    "pyspeex-noise>=1.0.2",
    "pyturbojpeg>=1.8.2",
]
lint = [
    "pre-commit==4.0.1",
    "ruff==0.7.0",
    "isort==5.13.2",
    "black==24.10.0",
]
tox = [
    "tox>=4.23.2",
    "tox-uv>=1.26.0",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.12",
    "mkdocs-material-extensions==1.3.1",
    "mkdocs-glightbox==0.4.0",
    "mike==2.1.3",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.per-file-ignores]
"tests/test_schema.py" = ["F403", "F405"]

[tool.isort]
profile = "black"
line_length = 120
force_sort_within_sections = true
combine_as_imports = true
known_first_party = [
    "custom_components.yandex_smart_home",
    "tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p no:aiohttp"
verbosity_assertions = 2
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "@abstractmethod",
    "if TYPE_CHECKING:",
    "pyright: ignore\\[reportAttributeAccessIssue\\]",
]
omit = ["tests/*"]

[tool.pyright]
reportPrivateImportUsage = "none"
reportIncompatibleVariableOverride = "none"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
follow_untyped_imports = true
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = [
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]
extra_checks = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_calls = false
disable_error_code = [
    "func-returns-value",
]

[[tool.mypy.overrides]]
module = "tests.test_repairs"
disallow_any_generics = false

[tool.tox]
env_list = [
    "type",
    "2024_12",
    "2025_1",
    "2025_2",
    "2025_4",
    "2025_5",
    "2025_6",
    "2025_7",
]

[tool.tox.env_run_base]
description = "Run test under {env_python}"
base_python = ["py313"]
runner = "uv-venv-lock-runner"
commands = [
    ["pytest", "--cov", "--cov-report=xml:{env_dir}/coverage.xml", "-n=auto"],
]

[tool.tox.env_run_base.setenv]
PYTHONDONTWRITEBYTECODE = "1"
MYPY_CACHE_DIR = "{env_dir}/.cache/mypy"

[tool.tox.env.2024_12]
uv_sync_flags = ["--directory=tests/env/2024_12"]

[tool.tox.env.2025_1]
uv_sync_flags = ["--directory=tests/env/2025_1"]

[tool.tox.env.2025_2]
uv_sync_flags = ["--directory=tests/env/2025_2"]

[tool.tox.env.2025_4]
uv_sync_flags = ["--directory=tests/env/2025_4"]

[tool.tox.env.2025_5]
uv_sync_flags = ["--directory=tests/env/2025_5"]

[tool.tox.env.2025_6]
uv_sync_flags = ["--directory=tests/env/2025_6"]

[tool.tox.env.2025_7]
uv_sync_flags = ["--directory=tests/env/2025_7"]

[tool.tox.env.type]
description = "Run type checks under {env_python}"
dependency_groups = ["test"]
commands = [
    ["mypy", "."],
]
